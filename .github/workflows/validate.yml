name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Minimal permissions - no deployment credentials
permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint code
        run: pnpm lint:code

      - name: Lint Markdown
        run: pnpm lint:markdown

      - name: Type check
        run: pnpm typecheck

      - name: Validate content
        run: pnpm validate:content

      - name: Extract examples
        run: pnpm examples:extract

      - name: Type-check examples
        run: pnpm examples:typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build site
        run: pnpm build

      - name: Generate job summary
        if: always()
        run: |
          echo "## Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "build/examples/manifest.json" ]; then
            TOTAL=$(cat build/examples/manifest.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))")
            PASS=$(cat build/examples/manifest.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(sum(1 for e in d if e['expectedOutcome']=='pass'))")
            TYPE_ERR=$(cat build/examples/manifest.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(sum(1 for e in d if e['expectedOutcome']=='type-error'))")
            RUNTIME_ERR=$(cat build/examples/manifest.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(sum(1 for e in d if e['expectedOutcome']=='runtime-error'))")
            SKIPPED=$(cat build/examples/manifest.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(sum(1 for e in d if e['runMode']=='skip'))")
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "| ------ | ----- |" >> $GITHUB_STEP_SUMMARY
            echo "| Total live examples | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| Passing examples | $PASS |" >> $GITHUB_STEP_SUMMARY
            echo "| Intentional type errors | $TYPE_ERR |" >> $GITHUB_STEP_SUMMARY
            echo "| Intentional runtime errors | $RUNTIME_ERR |" >> $GITHUB_STEP_SUMMARY
            echo "| Skipped examples | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
          fi
